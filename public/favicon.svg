<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="bready">
  <!-- A tab icon is 16px. What makes one findable is a large field of colour,
       not a detailed drawing — the old croissant had a transparent background
       and lost its white gaps at that size, so it read as a smudge. -->
  <defs>
    <linearGradient id="bready" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1aa7e8"/>
      <stop offset=".5" stop-color="#5b3fd6"/>
      <stop offset="1" stop-color="#e0218a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bready)"/>
  <text x="50" y="73" text-anchor="middle" fill="#fff"
        font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="600">b</text>
</svg>
