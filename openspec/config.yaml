schema: spec-driven

context: |
  bready — 빵집 추천/기록 개인 PWA.
  Tech stack: React 18, Vite 6, JavaScript (no TypeScript). Test: Vitest.
  Data: localStorage (offline-first PWA); next step = Supabase + Vercel.
  Structure: src/screens/* (UI), src/lib/* (logic + *.test.js).
  Conventions: conventional commits; keep changes small; write/maintain tests so
  coverage stays above the pre-commit threshold.

